# Builds the packages for all supported distributions.
#
# - Push of a tag "v*" (e.g. v1.0.0): build the .deb/.rpm packages, publish
#   them as a GitHub release with a list of changes, and publish the AUR
#   package gkey-config (when the secret AUR_SSH_PRIVATE_KEY is set).
# - Push to dev or manually ("Run workflow"): build only; the packages are
#   available as artifacts of the run for testing.
#
# In both cases the checks (build.yml) run first; packages are only built,
# released and published when all of them pass.
#
# .deb/.rpm are built with packaging/build-package.sh inside a container of the
# respective distribution (same script as for local builds). Only
# distributions with kernel >= 6.19 (G13 support in hid-lg-g15) are built.

name: Release packages

on:
  push:
    branches: [dev]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/build.yml

  packages:
    name: Build ${{ matrix.name }}
    needs: checks
    runs-on: ubuntu-latest
    # A normal build takes 2-5 minutes; a hanging mirror must not block for 6 hours.
    # Room for switching to other mirrors (up to 10 minutes per mirror).
    timeout-minutes: 60
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu26.04, image: "ubuntu:26.04" }
          - { name: fedora44,    image: "fedora:44" }

    steps:
      # git before the checkout, so that the full history including tags
      # (needed for the version number) is checked out.
      - name: Install git
        run: |
          if command -v apt-get >/dev/null; then
            # Mirrors in this order (the first inside Azure, where the runners
            # are): one that is too slow (5 minutes for the index or the
            # downloads, although data keeps arriving) is replaced by the next.
            # Retry: a mirror in sync can serve inconsistent index files for a
            # while; a stalled download fails after 30 s and is retried.
            # packaging/build-package.sh does the same for the build packages.
            printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
              > /etc/apt/apt.conf.d/80-retries
            for mirror in http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/ \
                          http://us.archive.ubuntu.com/ubuntu/ ""; do
              [ -n "$mirror" ] || exit 1
              sed -i "s#^URIs: http://[a-z.]*archive\.ubuntu\.com/ubuntu/*\$#URIs: $mirror#" \
                /etc/apt/sources.list.d/ubuntu.sources
              grep -h '^URIs' /etc/apt/sources.list.d/*.sources
              timeout 300 apt-get update -q &&
                timeout 300 apt-get install -y -q --no-install-recommends --download-only git ca-certificates &&
                break
              echo "apt: mirror $mirror too slow or failing, trying the next one" >&2
              sleep 10
            done
            apt-get install -y -q --no-install-recommends git ca-certificates
          else
            dnf install -y -q git
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check version
        if: github.ref_type == 'tag'
        run: |
          # The project version in CMakeLists.txt must match the tag (tarball builds use it).
          PROJECT=$(sed -n 's/^project(gkey-config VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$PROJECT" != "$GITHUB_REF_NAME" ]; then
            echo "CMakeLists.txt has version $PROJECT, the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build package
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export GKEY_PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          packaging/build-package.sh dist

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  arch:
    name: Build Arch Linux (AUR)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest

    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git pacman-contrib

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare PKGBUILD
        run: |
          mkdir -p aur
          cp packaging/arch/PKGBUILD packaging/arch/gkey-config.install aur/
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            sed -i "s/^pkgver=.*/pkgver=$VERSION/;s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
          else
            # No tag on GitHub yet: build this commit from a local tarball with
            # the name the PKGBUILD expects (makepkg does not download it then).
            VERSION=$(sed -n 's/^pkgver=//p' aur/PKGBUILD)
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git archive --prefix="gkey-config-$VERSION/" -o "aur/gkey-config-$VERSION.tar.gz" HEAD
          fi
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder: aur

      - name: Build gkey-config
        working-directory: aur
        run: |
          sudo -u builder updpkgsums
          sudo -u builder makepkg -s --noconfirm
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

      - name: Upload AUR files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur
          path: |
            aur/PKGBUILD
            aur/.SRCINFO
            aur/gkey-config.install
            aur/*.pkg.tar.zst
          include-hidden-files: true
          if-no-files-found: error

  # Runs on every push so that the release notes and the download are tested;
  # the GitHub release itself is only created for tags.
  release:
    name: Publish release
    needs: [packages, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Write release notes
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG=HEAD; fi
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s (%h)' "${PREV}..${TAG}"
            else
              echo "First release."
            fi
            echo
            echo "## Installation"
            echo
            echo "Requires Linux 6.19 or newer."
            echo
            echo "| System | Package |"
            echo "|---|---|"
            # GitHub replaces "~" in file names of release assets with "."
            echo "| Ubuntu 26.04 (and Linux Mint, Pop!_OS, ... based on it) | \`gkey-config_*.ubuntu26.04_amd64.deb\` |"
            echo "| Fedora 44 | \`gkey-config-*.fc44.x86_64.rpm\` |"
            echo "| Arch Linux | AUR: \`gkey-config\` |"
            echo
            echo '```bash'
            echo '# Ubuntu'
            echo 'sudo apt install ./gkey-config_<version>-1.ubuntu26.04_amd64.deb'
            echo '# Fedora'
            echo 'sudo dnf install ./gkey-config-<version>-1.fc44.x86_64.rpm'
            echo '```'
            echo
            echo "Then start *G-Key Configuration* from the application menu: on its first start it"
            echo "offers to start the daemon at login and to allow LED control."
            echo
            echo "gkey-config conflicts with linux-g13-driver; remove it first."
          } > release-notes.md
          cat release-notes.md
          ls -l dist

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run (e.g. after adding the AUR secret) replaces the assets.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi

  aur:
    name: Publish to the AUR
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check secret
        id: secret
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::Secret AUR_SSH_PRIVATE_KEY not set: the AUR files are only available as artifact 'aur'."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download AUR files
        if: steps.secret.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur
          path: aur

      - name: Push to the AUR
        if: steps.secret.outputs.present == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          # Ed25519 host key of aur.archlinux.org as published by Arch Linux
          # (https://archlinux.org/news/aur-migration-new-ssh-hostkeys/, 2020-07-28).
          AUR_HOST_KEY_SHA256: "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -t ed25519 aur.archlinux.org > aur_host 2>/dev/null
          fingerprint=$(ssh-keygen -lf aur_host -E sha256 | awk '{print $2}')
          if [ "$fingerprint" != "$AUR_HOST_KEY_SHA256" ]; then
            echo "::error::Unexpected host key of aur.archlinux.org: ${fingerprint:-none}"
            exit 1
          fi
          cat aur_host >> ~/.ssh/known_hosts
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes"
          git config --global user.name "Lordbooker"
          git config --global user.email "lordbooker@gmail.com"
          git clone ssh://aur@aur.archlinux.org/gkey-config.git repo
          cp aur/PKGBUILD aur/.SRCINFO aur/gkey-config.install repo/
          cd repo
          git add PKGBUILD .SRCINFO gkey-config.install
          if git diff --cached --quiet; then
            echo "gkey-config: unchanged"
          else
            git commit -m "Update to $GITHUB_REF_NAME"
            git push origin HEAD:master
          fi
